#################################################
#
# Build stage template
#
#################################################

parameters:
  - name: services
    type: object

  - name: stageDisplayName
    type: string
    default: Build & push

  - name: includeQA
    type: boolean
    default: false

stages:
  - stage: build
    displayName: ${{ parameters.stageDisplayName }}
    jobs:
      - job: build
        pool: ManagedDevOpsPools
        strategy:
          matrix:
            ${{ each service in parameters.services }}:
              ${{ service }}:
                SERVICE_NAME: ${{ service }}
        steps:
          - checkout: self

          - script: env | sort
            displayName: Show ENV vars

          - task: Docker@2
            inputs:
              command: login
              containerRegistry: Shared-Dockerhub-Datapunt
            displayName: Docker hub login

          - script: |
              az login --identity
              az acr login -n $(registry)

          # LOCK PRODUCTION IMAGES AND UNLOCK PREVIOUS IMAGES
          - script: |
              set -euo pipefail

              repository="aapp/images/app-$(SERVICE_NAME)"

              # Unlock only tags that currently have writeEnabled=false
              for tag in $(az acr repository show-tags \
                --name "$(registry)" \
                --repository "$repository" \
                --detail \
                --query "[?changeableAttributes.writeEnabled == \`false\` && !starts_with(name, 'main-')].name" \
                --output tsv)
              do
                image="${repository}:${tag}"
                echo "Unlocking image: $image"

                az acr repository update \
                  --name "$(registry)" \
                  --image "$image" \
                  --write-enabled true \
                  --output none
              done
            displayName: "Unlock previous tags"

          # BUILD
          - script: SERVICE_NAME=$(SERVICE_NAME) make build
            displayName: make build ($(SERVICE_NAME))

          # PUSH IMAGE
          - script: |
              SERVICE_NAME=$(SERVICE_NAME) make push || echo "Image already exists, ignoring"
            displayName: make push ($(SERVICE_NAME) )

          - ${{ if eq(parameters.includeQA, true) }}:
            # UNITTESTING & LINTING
            - script: make test
              displayName: make test

            # BACKWARDS COMPATIBILITY TESTING
            - script: |
                make openapi-diff | tee diff_output.txt
                if grep -q "API changes broke backward compatibility" diff_output.txt; then
                  echo "##vso[task.complete result=SucceededWithIssues;]Breaking OpenAPI changes detected!"
                fi
              displayName: make openapi-diff

            # SECURITY SCANNER
            - template: pipelines/aks/analyze.job.yaml@templates
              parameters:
                registry: $(registry)
                images:
                  - aapp/images/app-$(SERVICE_NAME)
                version: $(version)
                trivyImage: docker.io/aquasec/trivy:0.62.1
                trivyDbImage: ghcr.io/aquasecurity/trivy-db:2
                trivyJavaDbImage: ghcr.io/aquasecurity/trivy-java-db:1
                trivySkipFiles:
                  - '**/site-packages/PyJWT-*/METADATA'
                  - '**/site-packages/pyjwt-*/METADATA'
                trivySkipDirectories: []
                trivyTimeout: 5m0s
