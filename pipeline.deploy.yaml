#################################################
#
# Main pipeline (full CICD flow)
# - Triggers on pushes/merges to main
# - Builds, tests, analyzes & pushes images
# - Deploys to test (and optionally acc/prod)
# - Also triggers on infra deployments/** changes (aapp_infra_azure)
#
#################################################

# Disable PR triggers for this pipeline
pr: none

trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github.com_Amsterdam
      name: Amsterdam/common-azure-pipelines
      ref: refs/tags/1.20.3

    - repository: source
      type: git
      name: AMS-PRJ-AAPP/AMS-PRJ-AAPP
      ref: main
      trigger:
        branches:
          include:
            - main
        paths:
          include:
            - deployments/**

parameters:
  - name: versionOverride
    type: string
    default: ' '

  - name: migrationRollbackTarget
    type: string
    default: ' '

  - name: forceDeploy
    type: boolean
    default: false

  - name: services
    type: object
    default:
      - bridge
      - city_pass
      - construction_work
      - news
      - contact
      - image
      - modules
      - notification
      - waste
      - survey

variables:
  - name: Docker.Buildkit
    value: "1"

  - name: Self.Ref
    value: $[ variables['Build.SourceBranch'] ]

  - name: Self.BranchName
    value: $[ replace(replace(replace(variables['Self.Ref'], 'refs/heads/', ''), 'refs/tags/', ''), 'refs/pull/', '') ]

  - name: registry
    value: crsharedaksweu9x4d.azurecr.io

  - name: version
    ${{ if eq(parameters.versionOverride, ' ') }}:
      value: $[ format('{0}-{1}', replace(variables['Self.BranchName'], '/', '-'), variables['Build.SourceVersion']) ]
    ${{ else }}:
      value: ${{ parameters.versionOverride }}

stages:
  # --------------------
  # PREPARE
  # --------------------
  - template: pipeline.stage.prepare.yaml
    parameters:
      ACRKeyvault: ${{ parameters.ACRKeyvault }}
      ACRtokenServiceconnection: Azurerm-CCC-${{ parameters.teamIdentifier }}-ont-01
      ACRSecretName: acr-token-ams-${{ parameters.teamIdentifier }}
      teamIdentifier: ${{ parameters.teamIdentifier }}

  # --------------------
  # BUILD
  # --------------------
  - template: pipeline.stage.build.yaml
    parameters:
      services: ${{ parameters.services }}
      stageDisplayName: Build, test, analyze & push
      includeQA: true

  # --------------------
  # TEST
  # --------------------
  - template: pipeline.stage.deploy.yaml
    parameters:
      environment: test
      devopsEnvironment: api-test
      pool: ManagedDevOpsPools
      namespace: tst-ams-aapp-aapp-test
      kubernetesServiceConnection: sc-azurerm-ccc-aapp-test-01
      services: ${{ parameters.services }}
      force: ${{ parameters.forceDeploy }}
      migrationRollbackTarget: ${{ parameters.migrationRollbackTarget }}
      condition: |
        and(
          not(or(failed(), canceled())),
          or(
            eq(variables['Self.Ref'], 'refs/heads/main'),
            eq(variables['Build.Reason'], 'Manual')
          )
        )

  # --------------------
  # ACC
  # --------------------
  - template: pipeline.stage.deploy.yaml
    parameters:
      environment: acc
      devopsEnvironment: api-acc
      pool: ManagedDevOpsPools
      namespace: acc-ams-aapp-aapp-acc
      kubernetesServiceConnection: sc-azurerm-ccc-aapp-acc-01
      services: ${{ parameters.services }}
      force: ${{ parameters.forceDeploy }}
      migrationRollbackTarget: ${{ parameters.migrationRollbackTarget }}
      condition: |
        and(
          not(or(failed(), canceled())),
          or(
            eq(variables['Self.Ref'], 'refs/heads/main'),
            eq(variables['Build.Reason'], 'Manual')
          ),
          startsWith(variables['version'], 'main')
        )

  # --------------------
  # PROD
  # --------------------
  - template: pipeline.stage.deploy.yaml
    parameters:
      environment: prod
      devopsEnvironment: api-prod
      pool: ManagedDevOpsPools
      namespace: prd-ams-aapp-aapp-prd
      kubernetesServiceConnection: sc-azurerm-ccc-aapp-prd-01
      services: ${{ parameters.services }}
      force: ${{ parameters.forceDeploy }}
      migrationRollbackTarget: ${{ parameters.migrationRollbackTarget }}
      condition: |
        and(
          not(or(failed(), canceled())),
          or(
            eq(variables['Self.Ref'], 'refs/heads/main'),
            eq(variables['Build.Reason'], 'Manual')
          ),
          startsWith(variables['version'], 'main')
        )
