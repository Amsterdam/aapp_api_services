#################################################
#
# Main pipeline (full CICD flow)
# - Triggers on pushes/merges to main
# - Builds, tests, analyzes & pushes images
# - Deploys to test (and optionally acc/prod)
# - Also triggers on infra deployments/** changes (aapp_infra_azure)
#
#################################################

# Disable PR triggers for this pipeline
pr: none

trigger:
  branches:
    include:
      - main

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github.com_Amsterdam
      name: Amsterdam/common-amsterdam-pipelines
      ref: refs/tags/1.0.0

    - repository: source
      type: git
      name: AMS-PRJ-AAPP/AMS-PRJ-AAPP
      ref: main

parameters:
  - name: versionOverride
    type: string
    default: ' '

  - name: migrationRollbackTarget
    type: string
    default: ' '

  - name: forceDeploy
    type: boolean
    default: false

  - name: services
    type: object
    default:
      - bridge
      - city_pass
      - construction_work
      - news
      - contact
      - image
      - modules
      - notification
      - waste
      - survey

variables:
  - name: Docker.Buildkit
    value: "1"

  - name: Self.Ref
    value: $[ variables['Build.SourceBranch'] ]

  - name: Self.BranchName
    value: $[ replace(replace(replace(variables['Self.Ref'], 'refs/heads/', ''), 'refs/tags/', ''), 'refs/pull/', '') ]

  - name: registry
    value: crsharedaksweu9x4d.azurecr.io

  - name: version
    ${{ if eq(parameters.versionOverride, ' ') }}:
      value: $[ format('{0}-{1}', replace(variables['Self.BranchName'], '/', '-'), variables['Build.SourceVersion']) ]
    ${{ else }}:
      value: ${{ parameters.versionOverride }}

stages:
  # --------------------
  # PREPARE
  # --------------------
  - stage: prepare
    displayName: preparing variables
    jobs:
      - template: pipeline.stage.prepare.yaml@source
        parameters:
          ACRKeyvault: shared-o-njo5j7pxxiapu
          ACRtokenServiceconnection: sc-azurerm-ccc-aapp-ont-01
          ACRSecretName: acr-token-ams-aapp

  # --------------------
  # BUILD
  # --------------------
  - template: pipeline.stage.build.yaml@source
    parameters:
      services: ${{ parameters.services }}
      stageDisplayName: Build, test, analyze & push
      includeQA: true

  # --------------------
  # TEST
  # --------------------
  - template: pipeline.stage.deploy.yaml@source
    parameters:
      environment: test
      devopsEnvironment: api-test
      aksSubscriptionId: db369b0b-5c73-41cf-b089-ec02d80c0bd4
      pool: ManagedDevOpsPools
      namespace: tst-ams-aapp-aapp-test
      serviceConnection: sc-azurerm-ccc-aapp-test-01
      services: ${{ parameters.services }}
      force: ${{ parameters.forceDeploy }}
      migrationRollbackTarget: ${{ parameters.migrationRollbackTarget }}
      dependsOn:
        - prepare
        - build
      condition: |
        and(
          not(or(failed(), canceled())),
          or(
            eq(variables['Self.Ref'], 'refs/heads/main'),
            eq(variables['Build.Reason'], 'Manual')
          )
        )

  # --------------------
  # ACC
  # --------------------
  - template: pipeline.stage.deploy.yaml@source
    parameters:
      environment: acc
      devopsEnvironment: api-acc
      aksSubscriptionId: ceaaa4a3-c257-4189-bf16-078117df908c
      pool: ManagedDevOpsPools
      namespace: acc-ams-aapp-aapp-acc
      serviceConnection: sc-azurerm-ccc-aapp-acc-01
      services: ${{ parameters.services }}
      force: ${{ parameters.forceDeploy }}
      migrationRollbackTarget: ${{ parameters.migrationRollbackTarget }}
      dependsOn:
        - prepare
        - build
        - test
      condition: |
        and(
          not(or(failed(), canceled())),
          or(
            eq(variables['Self.Ref'], 'refs/heads/main'),
            eq(variables['Build.Reason'], 'Manual')
          )
          # startsWith(variables['version'], 'main')
        )

  # --------------------
  # PROD
  # --------------------
  - template: pipeline.stage.deploy.yaml@source
    parameters:
      environment: prod
      devopsEnvironment: api-prod
      aksSubscriptionId: 58d49111-48f0-4a70-9d9d-d4e163b3e12b
      pool: ManagedDevOpsPools
      namespace: prd-ams-aapp-aapp-prd
      serviceConnection: sc-azurerm-ccc-aapp-prd-01
      services: ${{ parameters.services }}
      force: ${{ parameters.forceDeploy }}
      migrationRollbackTarget: ${{ parameters.migrationRollbackTarget }}
      dependsOn:
        - prepare
        - build
        - test
        - acc
      condition: |
        and(
          not(or(failed(), canceled())),
          or(
            eq(variables['Self.Ref'], 'refs/heads/main'),
            eq(variables['Build.Reason'], 'Manual')
          )
          # startsWith(variables['version'], 'main')
        )
