      \          title\r

      \          changedDate\r

      \          publicationDate\r

      \          image {\r

      \            ... on Image {\r

      \              name\r

      \              src\r

      \            }\r

      \          }\r

      \          planCategory {\r

      \            id\r

      \            name\r

      \          }\r

      \          planStatus {\r

      \            name\r

      \          }\r

      \          id\r

      \          path\r

      \          summaryShort\r

      \          summaryIntroductory\r

      \          metaDescription\r

      \        }\r

      \      }\r

      \      itemsPerPage\r

      \    }\r

      \  }\r

