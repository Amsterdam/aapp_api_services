info:
  name: Overzicht werkzaamheden
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{DrupalBaseUrl}}"
  body:
    query: |
      query MyQuery($paragraphId: Int!) {
        view(paragraphId: $paragraphId, page: 1) {
          name
          pagination {
            totalPages
            previousPage
            nextPage
            enabled
            currentPage
          }
          ... on View {
            name
            nodes {
              ... on Plan {
                title
                changedDate
                publicationDate
                image {
                  ... on Image {
                    name
                    src
                  }
                }
                planCategory {
                  id
                  name
                }
                planStatus {
                  name
                }
                id
                path
                summaryShort
                summaryIntroductory
                metaDescription
              }
            }
            itemsPerPage
          }
        }
      }
    variables: |-
      {
        "paragraphId": 79888 // acc: 206731, prd: 79888
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
