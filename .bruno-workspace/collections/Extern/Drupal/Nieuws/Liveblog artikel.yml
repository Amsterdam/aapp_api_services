info:
  name: Liveblog artikel
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{DrupalBaseUrl}}"
  body:
    query: |
      query MyQuery($nodeID: Int!) {
        nodeByID(id: $nodeID){
          ... on Blog {
                __typename
                id
                tag {
                  id
                  name
                }
                summaryShort
                title
                changedDate
                displayChangedDate
                metaDescription
                path
                image {
                  ... on Image {
                    name
                    src
                  }
                }
              blogEntries {
              ... on ParagraphBlogEntry {
                id
                title
                content {
                  ... on ParagraphTextAndImage {
                    id
                    text
                    style
                    position
                    image_style
                    image_caption
                    image {
                      ... on MediaInterface {
                        ... on Image {
                          id
                          name
                          src
                          width
                          height
                          alt
                          description
                        }
                      }
                    }
                  }
                }
              }
            }
                       
                
              }
        }
      }
    variables: |-
      {
        "nodeID": 32368
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
