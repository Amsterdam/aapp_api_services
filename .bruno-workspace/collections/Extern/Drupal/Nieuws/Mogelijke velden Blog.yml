info:
  name: Mogelijke velden Blog
  type: graphql
  seq: 6

graphql:
  method: POST
  url: "{{DrupalBaseUrl}}"
  body:
    query: |-
      query {
        __type(name: "Blog") {
          fields {
            name
            type { name kind ofType { name kind } }
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
