info:
  name: mijnamsterdam_api_v1_access_token
  type: http
  seq: 3
  tags:
    - mijnamsterdam

http:
  method: POST
  url: "{{baseUrl}}/mijnamsterdam/api/v1/access-token"
  headers:
    - name: DeviceId
      value: ""
      disabled: true
    - name: X-Api-Key
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "authorization_code": "foobar",
        "code_verifier": "pass123"
      }
  auth:
    type: apikey
    key: X-Api-Key
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/mijnamsterdam/api/v1/access-token"
      method: GET
      headers:
        - name: DeviceId
          value: ""
        - name: X-Api-Key
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access_token": "access_foobar"
          }
  - name: 401 Response
    request:
      url: "{{baseUrl}}/mijnamsterdam/api/v1/access-token"
      method: GET
      headers:
        - name: X-Api-Key
          value: "{{apiKey}}"
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "API_KEY_INVALID",
            "detail": ""
          }
