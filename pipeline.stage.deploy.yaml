#################################################
#
# Deployment stage template
#
#################################################

parameters:
  - name: environment
    type: string

  - name: devopsEnvironment
    type: string

  - name: pool
    type: string

  - name: aksSubscriptionId
    type: string
    default: "a1943d29-3d62-4c2c-bd3b-483e39436191"

  - name: serviceConnection
    type: string

  - name: clusterName
    type: string

  - name: namespace
    type: string

  - name: resourceGroup
    type: string

  - name: services
    type: object

  - name: force
    type: boolean
    default: false

  - name: migrationRollbackTarget
    type: string
    default: ' '

  - name: condition
    type: string
    default: ''


stages:
- stage: ${{ parameters.environment }}
  displayName: Deploy to ${{ parameters.environment }}
  dependsOn:
    - prepare
    - build
  variables:
    ACRToken: $[ stageDependencies.prepare.Get_ACR_Credentials.outputs['Get_ACR_Credentials.token'] ]
    ACRUser: ams-AAPP-token

  ${{ if parameters.condition }}:
    condition: ${{ parameters.condition }}

  jobs:
    - ${{ each service in parameters.services }}:
      - deployment: deploy_${{ service }}
        displayName: Deploy ${{ service }}
        pool: ${{ parameters.pool }}
        environment: ${{ parameters.devopsEnvironment }}
        variables:
          environment: ${{ parameters.environment }}
          service_name: ${{ replace(service, '_', '-') }}

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: source
                
                - task: AzureCLI@2
                  displayName: Configure kubectl
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    useGlobalConfig: true
                    inlineScript: |
                      set -euo pipefail

                      echo "subscription ID is:" "${{ parameters.aksSubscriptionId }}"
                      az account set --subscription "${{ parameters.aksSubscriptionId }}"

                      az aks get-credentials \
                        --name "${{ parameters.clusterName }}" \
                        --resource-group "${{ parameters.resourceGroup }}" \
                        --overwrite-existing

                      kubelogin convert-kubeconfig -l azurecli

                      kubectl config set-context --current \
                        --namespace "${{ parameters.namespace }}"

                      kubectl get pods

                - script: |
                    echo "$ACR_TOKEN" | docker login $(registry) \
                      --username "$ACR_USER" \
                      --password-stdin
                  displayName: ACR login
                  env:
                    ACR_USER: $(ACRUser)
                    ACR_TOKEN: $(ACRToken)

                - ${{ if eq(parameters.environment, 'prod') }}:
                  # LOCK PRODUCTION IMAGES AND UNLOCK PREVIOUS IMAGES
                  - script: |
                      set -euo pipefail

                      repository="aapp/images/app-${{ service }}"

                      # Unlock only locked tags (exclude newest 3)
                      for tag in $(az acr repository show-tags \
                        --name "$(registry)" \
                        --repository "$repository" \
                        --detail \
                        --orderby time_desc \
                        --query '[?changeableAttributes.writeEnabled == `false`].name | [3:]' \
                        --output tsv)
                        --username "$acr_user" \
                        --password "$acr_token" \
                      do
                        image="${repository}:${tag}"
                        echo "Unlocking image: $image"

                        az acr repository update \
                          --name "$(registry)" \
                          --image "$image" \
                          --write-enabled true \
                          --output none \
                          --username "$acr_user" \
                          --password "$acr_token"
                      done

                      # Lock the newly produced image
                      image="${repository}:$(version)"
                      echo "Locking image: $image"

                      az acr repository update \
                        --name "$(registry)" \
                        --image "$image" \
                        --write-enabled false \
                        --output none \
                        --username "$acr_user" \
                        --password "$acr_token"
                    displayName: "Unlock previous tags and lock app-${{ service }}"
                    env:
                      ACR_USER: $(ACRUser)
                      ACR_TOKEN: $(ACRToken)
                      
                - ${{ if eq(parameters.force, true) }}:
                  - script: helm uninstall $(service_name) --ignore-not-found
                    displayName: Helm uninstall $(service_name)

                - ${{ if ne(parameters.migrationRollbackTarget, ' ') }}:
                  - script: MIGRATION_TARGET="${{ parameters.migrationRollbackTarget }}" make rollback/${{ service }}
                    displayName: Rollback migration ($(service_name))

                - script: make deploy/$(service_name)
                  displayName: Deploy $(service_name)

                - ${{ if eq(parameters.environment, 'acc') }}:
                  - script: |
                      docker run --rm openapitools/openapi-diff:latest "https://app.amsterdam.nl/$(service_name)/api/v1/openapi" "https://acc.app.amsterdam.nl/$(service_name)/api/v1/openapi" | tee diff_output.txt
                      cat diff_output.txt
                      if grep -q "API changes broke backward compatibility" diff_output.txt; then
                        echo "##vso[task.complete result=SucceededWithIssues;]Breaking OpenAPI changes detected!"
                      fi
                    displayName: Run openapi-diff
