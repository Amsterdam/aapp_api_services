#################################################
#
# PR pipeline (develop flow)
# - Triggers on PRs
# - Builds & pushes images
# - Deploys to dev
#
#################################################

pr:
  branches:
    include:
      - "*"

# Disable CI triggers for pushes/merges in this pipeline
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: Amsterdam
      name: Amsterdam/common-azure-pipelines
      ref: refs/tags/1.20.3

    # Infra repo used by deploy.stage.yaml (it does `checkout: source`)
    # No trigger here: infra changes should not start this PR pipeline.
    - repository: source
      type: git
      name: Amsterdam-App/aapp_infra_azure
      ref: main

parameters:
  - name: versionOverride
    type: string
    default: ' '

  - name: migrationRollbackTarget
    type: string
    default: ' '

  - name: forceDeploy
    type: boolean
    default: true

  - name: services
    type: object
    default:
      - bridge
      - city_pass
      - construction_work
      - news
      - contact
      - image
      - modules
      - notification
      - waste
      - survey

variables:
  - name: Docker.Buildkit
    value: "1"

  - name: Self.Ref
    value: $[ variables['Build.SourceBranch'] ]

  - name: Self.BranchName
    value: $[ replace(replace(replace(variables['Self.Ref'], 'refs/heads/', ''), 'refs/tags/', ''), 'refs/pull/', '') ]

  - name: registry
    value: saks01weuacrpgpgo5qvmwo

  - name: version
    ${{ if eq(parameters.versionOverride, ' ') }}:
      value: ${{ replace(variables['Self.BranchName'], '/', '-') }}
    ${{ else }}:
      value: ${{ parameters.versionOverride }}

stages:
  - stage: echo_locked_tags
    jobs:
      - job: echo_locked_tags_job
        pool: ManagedDevOpsPools
        steps:
          - checkout: self

          - script: |
              az login --identity
              az acr login -n $(registry)
            displayName: ACR login

          - script: |
              set -euo pipefail
      
              repositories=$(az acr repository list \
                --name "$(registry)" \
                --query "[?starts_with(@, 'aapp/images/')]" \
                --output tsv)
      
              while IFS= read -r repository
              do
                [[ -z "$repository" ]] && continue
      
                echo "Processing repository: $repository"
      
                tags=$(az acr repository show-tags \
                  --name "$(registry)" \
                  --repository "$repository" \
                  --detail \
                  --query "[?changeableAttributes.writeEnabled == \`false\` && !starts_with(name, 'main-')].name" \
                  --output tsv)
      
                while IFS= read -r tag
                do
                  [[ -z "$tag" ]] && continue
      
                  image="${repository}:${tag}"
                  echo "Unlocking tag: $image"

                  az acr repository update \
                    --name "$(registry)" \
                    --image "$image" \
                    --write-enabled true \
                    --output none

                done <<< "$tags"
      
              done <<< "$repositories"
            displayName: "Unlock previous tags"

  # --------------------
  # BUILD
  # --------------------
  - template: deploy.build-stage.yaml
    parameters:
      services: ${{ parameters.services }}
      stageDisplayName: Build & push

