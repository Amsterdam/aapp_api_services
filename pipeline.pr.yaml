#################################################
#
# PR pipeline (develop flow)
# - Triggers on PRs
# - Builds & pushes images
# - Deploys to dev
#
#################################################

pr:
  branches:
    include:
      - "*"

# Disable CI triggers for pushes/merges in this pipeline
trigger: none

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: github.com_Amsterdam
      name: Amsterdam/common-amsterdam-pipelines
      ref: refs/tags/1.0.0

    # Infra repo used by deploy.stage.yaml (it does `checkout: source`)
    # No trigger here: infra changes should not start this PR pipeline.
    - repository: source
      type: git
      name: AMS-PRJ-AAPP/AMS-PRJ-AAPP
      ref: main

parameters:
  - name: versionOverride
    type: string
    default: ' '

  - name: migrationRollbackTarget
    type: string
    default: ' '

  - name: forceDeploy
    type: boolean
    default: true

  - name: services
    type: object
    default:
      - bridge
      - city_pass
      - construction_work
      - news
      - contact
      - image
      - modules
      - notification
      - waste
      - survey

variables:
  - name: Docker.Buildkit
    value: "1"

  - name: Self.Ref
    value: $[ variables['Build.SourceBranch'] ]

  - name: Self.BranchName
    value: $[ replace(replace(replace(variables['Self.Ref'], 'refs/heads/', ''), 'refs/tags/', ''), 'refs/pull/', '') ]

  - name: registry
    value: crsharedaksweu9x4d.azurecr.io

  - name: version
    ${{ if eq(parameters.versionOverride, ' ') }}:
      value: $[ replace(variables['Self.BranchName'], '/', '-') ]
    ${{ else }}:
      value: ${{ parameters.versionOverride }}

stages:
  # --------------------
  # PREPARE
  # --------------------
  - template: pipeline.stage.prepare.yaml
    parameters:
      ACRKeyvault: shared-o-njo5j7pxxiapu
      ACRtokenServiceconnection: Azurerm-CCC-AAPP-ont-01
      ACRSecretName: acr-token-ams-AAPP

  # --------------------
  # BUILD
  # --------------------
  - template: pipeline.stage.build.yaml
    parameters:
      services: ${{ parameters.services }}
      stageDisplayName: Build & push
      includeQA: false

  # --------------------
  # DEV
  # --------------------
  - template: pipeline.stage.deploy.yaml
    parameters:
      environment: dev
      devopsEnvironment: api-dev
      pool: ManagedDevOpsPools
      namespace: dev-ams-aapp-aapp-ontw
      serviceConnection: sc-azurerm-ccc-aapp-ont-01
      services: ${{ parameters.services }}
      force: ${{ parameters.forceDeploy }}
      migrationRollbackTarget: ${{ parameters.migrationRollbackTarget }}