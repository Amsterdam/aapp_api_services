parameters:
  - name: serviceConnection
    type: string

  - name: aksSubscriptionId
    type: string
    default: "a1943d29-3d62-4c2c-bd3b-483e39436191"

  - name: namespace
    type: string

  - name: workingDirectory
    type: string
    default: $(Pipeline.Workspace)/s/source

  - name: displayName
    type: string
    default: kubectl

  - name: script
    type: string

steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.displayName }}
    env:
      ACR_USER: $(ACRUser)
      ACR_TOKEN: $(ACRToken)
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: ${{ parameters.workingDirectory }}
      inlineScript: |
        echo "Working directory:"
        pwd
        ls -la

        echo "subscription ID is:" "${{ parameters.aksSubscriptionId }}"
        az account set --subscription "${{ parameters.aksSubscriptionId }}"
        az aks get-credentials \
          --name aks-$(environment)-weu-001 \
          --resource-group aks-$(environment)-rg \
          --overwrite-existing
        kubelogin convert-kubeconfig -l azurecli
        kubectl config set-context --current --namespace "${{ parameters.namespace }}"
        
        acr_user="${ACR_USER:-}"
        acr_token="${ACR_TOKEN:-}"
        if [[ "$acr_user" =~ ^\$\(.+\)$ ]]; then
          acr_user=""
        fi

        if [[ "$acr_token" =~ ^\$\(.+\)$ ]]; then
          acr_token=""
        fi

        echo "ACR_USER: $acr_user"
        echo "ACR_TOKEN: $acr_token"

        if [[ -n "$acr_user" && -n "$acr_token" ]]; then
          printf '%s' "$acr_token" | helm registry login "$(registry)" -u "$acr_user" --password-stdin
        else
          echo '##[warning] ACR credentials are not set, the helm registry login will be skipped, if ACR actions are required run the "prepare" stage to set these credentials'
        fi
          
        ${{ parameters.script }}